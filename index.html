<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luach · Hebrew dates for Google Calendar</title>
    <meta name="description" content="Create Google Calendar events that repeat on the Hebrew date (RRULE RSCALE=HEBREW)." />
    <script>
      try {
        var t = localStorage.getItem("theme")
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark")
        // Avoid a left-to-right flash before React applies the saved language.
        var l = localStorage.getItem("lang")
        var first = navigator.languages.find(function (x) { return /^(en|he|iw)\b/i.test(x) })
        if (l === "he" || (!l && first && /^(he|iw)\b/i.test(first))) {
          document.documentElement.lang = "he"
          document.documentElement.dir = "rtl"
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
